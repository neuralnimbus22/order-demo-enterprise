name: Build & Push Images (multi-arch)

# Builds the service images for linux/amd64 and linux/arm64 and pushes them to
# GHCR under ghcr.io/neuralnimbus22/order-demo-<service>:latest.
# Multi-arch is required so the same tag works on Docker Desktop (typically
# arm64 on Apple Silicon) and on GKE (typically amd64 nodes).

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'services/**'
      - '.github/workflows/build-images.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, order, payment, inventory, product-catalog]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/neuralnimbus22/order-demo-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
