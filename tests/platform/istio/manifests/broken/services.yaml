# Same Services as good/ — present so hosts OTHER than the deliberately broken
# references still resolve, isolating the planted errors to virtual-service.yaml.
apiVersion: v1
kind: Service
metadata:
  name: order-demo-ui
  namespace: order-demo
  labels:
    app: order-demo-ui
spec:
  selector:
    app: order-demo-ui
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: order-demo
  labels:
    app: order
spec:
  selector:
    app: order
  ports:
    - name: http
      port: 3002
      targetPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: order-demo
  labels:
    app: payment
spec:
  selector:
    app: payment
  ports:
    - name: http
      port: 3004
      targetPort: 3004
