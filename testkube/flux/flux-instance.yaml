# The Flux this lab runs, declared for the Flux Operator.
# bootstrap.sh installs the operator, then applies this file. The operator
# installs these controllers into flux-system and keeps them as declared.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux               # the operator accepts one FluxInstance, named flux
  namespace: flux-system   # the namespace the operator runs in
spec:
  distribution:
    version: "2.9.6"           # exact Flux version, embedded in Flux Operator 0.61.0
    registry: ghcr.io/fluxcd   # where the controller images come from
  components:
    - source-controller        # reads the repository (GitRepository)
    - kustomize-controller     # applies a folder from it (Kustomization)
    - helm-controller          # installs charts as HelmReleases, for a later step
  cluster:
    type: kubernetes
    networkPolicy: true        # Flux's own network policies, in flux-system only
    domain: cluster.local
