# Flux applies every Test Workflow in testkube/pr-checks/ into the testkube
# namespace. The Testkube runner watches that namespace and syncs what Flux
# applies up to the Testkube control plane.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pr-checks
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: order-demo-enterprise
  path: ./testkube/pr-checks
  prune: true
  targetNamespace: testkube
