# Values for the Flux Helm chart flux2 2.19.1 (Flux 2.9.5), from
# https://fluxcd-community.github.io/helm-charts.
# bootstrap.sh installs the chart with this file.
#
# Reading Git and applying a folder needs two controllers:
#   source-controller     reads the repository (GitRepository)
#   kustomize-controller  applies the folder to the cluster (Kustomization)
# helm-controller stays on, so a later step can install charts as HelmReleases.
# The other controllers are off to keep the lab small. Every other value is the
# chart's default.

imageAutomationController:
  create: false   # writes new image tags back to Git; not used here
imageReflectionController:
  create: false   # scans registries for new image tags; not used here
notificationController:
  create: false   # sends Flux events to Slack or webhooks; not used here
