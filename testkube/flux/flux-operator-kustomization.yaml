# Flux applies ./testkube/flux/operator: the Flux Operator chart and its
# HelmRelease. wait makes this Kustomization Ready only once the operator runs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: order-demo-enterprise
  path: ./testkube/flux/operator
  prune: true
  wait: true
  timeout: 5m
