kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: mock-services-gate
  labels:
    ticket: TSE-854
    mocks: gate
spec:
  # Always run on the home lab runner: another runner in the org has taken runs meant for it.
  execution:
    target:
      match:
        name:
        - testkube-runner
  config:
    branch:
      type: string
      default: mock-services-demo
  steps:
  # One verdict for a branch: fails when either workflow fails.
  - name: Run the Prism and Microcks workflows for the branch
    execute:
      parallelism: 2
      workflows:
      - name: mock-services-prism
        config:
          branch: '{{config.branch}}'
      - name: mock-services-microcks
        config:
          branch: '{{config.branch}}'
