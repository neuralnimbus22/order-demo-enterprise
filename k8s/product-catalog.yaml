apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: order-demo
  labels:
    app: product-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-catalog
  template:
    metadata:
      labels:
        app: product-catalog
    spec:
      containers:
        - name: product-catalog
          image: ghcr.io/neuralnimbus22/order-demo-product-catalog:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3005
          env:
            - name: PORT
              value: "3005"
            # Reuses the existing `db` Postgres + `inventory` credentials.
            # Catalog rows live in a NEW `products` table cleanly separate
            # from inventory's `stock` table — see IMPLEMENTATION.md for
            # the data-store decision and rationale.
            - name: DB_HOST
              value: db.order-demo.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: inventory
            - name: DB_PASSWORD
              value: inventory
            - name: DB_NAME
              value: inventory
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  namespace: order-demo
  labels:
    app: product-catalog
spec:
  type: ClusterIP
  selector:
    app: product-catalog
  ports:
    - name: http
      port: 3005
      targetPort: 3005
