apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: order-demo
  labels:
    app: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: payment
          image: ghcr.io/neuralnimbus22/order-demo-payment:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: KAFKA_BROKERS
              value: kafka.order-demo.svc.cluster.local:9092
            - name: KAFKA_TOPIC
              value: payment-confirmed
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: order-demo
  labels:
    app: payment
spec:
  type: ClusterIP
  selector:
    app: payment
  ports:
    - name: http
      port: 3004
      targetPort: 3004
